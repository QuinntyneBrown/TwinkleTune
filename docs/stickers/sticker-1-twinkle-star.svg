<?xml version="1.0" encoding="UTF-8"?>
<!--
  TwinkleTune die-cut sticker — Twinkle the star
  Generated by docs/stickers/render-stickers.mjs from src/sticker-1-twinkle-star.html.
  Edit the HTML, not this file.

  The die cut is the outer edge of the white keyline, which is also the alpha
  edge of sticker-1-twinkle-star.png. #cutline below traces the *artwork* outline in magenta —
  the prepress convention — and is hidden by default; the actual cut runs the
  width of the white keyline outside it: 65px, 0.217in at 300 DPI.
  Text is live — outline it before sending this SVG to a printer that is not
  rasterising the PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="3in" height="3in" style="--cut-extra: 134px">
  <title>Twinkle the star</title>
  <defs>
    <style>
      @font-face {
        font-family: "Baloo 2";
        src: url("src/fonts/Baloo2-Variable.ttf") format("truetype");
        font-weight: 400 800;
        font-display: block;
      }
      @font-face {
        font-family: "Nunito";
        src: url("src/fonts/Nunito-Variable.ttf") format("truetype");
        font-weight: 200 1000;
        font-display: block;
      }

      /* --- Shared artwork idioms -------------------------------------------- */
      
      /* Every silhouette piece is painted white with a fat round-joined stroke
         and paint-order:stroke, so the stroke sits entirely outside the shape.
         Overlapping white pieces union into one continuous die-cut outline. */
      .keyline {
        fill: #ffffff;
        stroke: #ffffff;
        stroke-linejoin: round;
        stroke-linecap: round;
        paint-order: stroke;
      }
      
      /* Width = the shape's own art stroke + --cut-extra, half of which shows as
         white beyond the artwork edge. The rim is wide enough to carry the
         TWINKLETUNE.APP edge type.
      
         --cut-extra is in ART-SPACE units, and each sticker scales its art group by
         a different factor, so every sticker overrides it with 130px / its own scale.
         That lands the visible rim at a uniform 65 canvas px (0.217in at 300 DPI)
         across all three. Setting one shared value here instead would make the rim
         visibly thicker on the more-scaled-up stickers. */
      :root { --cut-extra: 130px; }
      .cut-star { stroke-width: calc(38.5px + var(--cut-extra)); } /* big star   */
      .cut-icon { stroke-width: calc(15.6px + var(--cut-extra)); } /* icon star  */
      .cut-mini { stroke-width: calc(13px + var(--cut-extra)); }   /* small star */
      .cut-band { stroke-width: calc(8px + var(--cut-extra)); }    /* banner     */
      .cut-line { stroke-width: calc(10px + var(--cut-extra)); }   /* bubble     */
      .cut-cloud { stroke-width: calc(10px + var(--cut-extra)); }  /* cloud      */
      .cut-flat { stroke-width: var(--cut-extra); }                /* sparkles   */
      
      .tt-star-face circle { stroke: none; }
      
      text {
        paint-order: stroke;
        stroke-linejoin: round;
      }

      #cutline { display: none; }
      .cutline-path {
        fill: none;
        stroke: #ff00ff;
        stroke-width: 2;
        stroke-linejoin: round;
      }
    </style>
  </defs>

        <title>Twinkle the star coach with a TwinkleTune banner</title>

        <!-- Fit to the 3in canvas. Note the widest points are the two side
             sparkles, not the star: their white rim reaches x 9 and x 898 in this
             coordinate space, so the scale is set by 889 art-px of width, not by
             the star's 594. -->
        <g transform="translate(11.5 38.2) scale(0.9669)">

          <defs>
            <!-- Arc for the edge URL, down the middle of the white rim below the
                 banner. The banner's bottom edge runs (750,764) -> control
                 (450,739) -> (150,764); adding its 4px half-stroke puts the
                 artwork edge at y 768 (ends) / 755.5 (centre), and the rim runs
                 67px out from there. This arc parallels it 24px clear of the
                 artwork, leaving the same clearance again outside the type. -->
            <path id="urlArc" fill="none" d="M 210 811 Q 450 786 690 811" />
          </defs>

          <!-- ── Die-cut silhouette ──────────────────────────────────────────
               White fill + fat white stroke with paint-order:stroke, so the
               stroke lies wholly outside each shape. The pieces all overlap,
               so their union is one continuous cut line. -->
          <g>
            <path
              class="keyline cut-flat"
              d="M130 246 Q139 291 184 300 Q139 309 130 354 Q121 309 76 300 Q121 291 130 246 Z"
            />
            <path
              class="keyline cut-flat"
              d="M785 222 Q792 261 831 268 Q792 275 785 314 Q778 275 739 268 Q778 261 785 222 Z"
            />
            <path
              class="keyline cut-flat"
              d="M600 152 Q606 184 638 190 Q606 196 600 228 Q594 196 562 190 Q594 184 600 152 Z"
            />
            <path
              class="keyline cut-star"
              d="M450 103 L532.5 301 L747 317.5 L582 460.5 L637 675 L450 559.5 L263 675 L318 460.5 L153 317.5 L367.5 301 Z"
            />
            <path
              class="keyline cut-band"
              d="M150 650 Q450 625 750 650 L700 707 L750 764 Q450 739 150 764 L200 707 Z"
            />
          </g>

          <!-- ── Sparkles (behind the star, so only the outside petals show) ── -->
          <path
            d="M130 246 Q139 291 184 300 Q139 309 130 354 Q121 309 76 300 Q121 291 130 246 Z"
            fill="#FFD66B"
          />
          <path
            d="M785 222 Q792 261 831 268 Q792 275 785 314 Q778 275 739 268 Q778 261 785 222 Z"
            fill="#5EA8DA"
          />
          <path
            d="M600 152 Q606 184 638 190 Q606 196 600 228 Q594 196 562 190 Q594 184 600 152 Z"
            fill="#FFD66B"
          />

          <!-- ── The star ──────────────────────────────────────────────────── -->
          <path
            d="M450 103 L532.5 301 L747 317.5 L582 460.5 L637 675 L450 559.5 L263 675 L318 460.5 L153 317.5 L367.5 301 Z"
            fill="#FFD66B"
            stroke="#E8B445"
            stroke-width="38.5"
            stroke-linejoin="round"
          />

          <!-- Face — happy variant of mascotSVG(), same coordinates scaled -->
          <g class="tt-star-face">
            <circle cx="345.5" cy="433" r="30.25" fill="#F4DBE3" />
            <circle cx="554.5" cy="433" r="30.25" fill="#F4DBE3" />
            <circle cx="384" cy="378" r="24.75" fill="#2B5876" />
            <circle cx="516" cy="378" r="24.75" fill="#2B5876" />
            <circle cx="376" cy="370" r="8" fill="#FFFFFF" />
            <circle cx="508" cy="370" r="8" fill="#FFFFFF" />
          </g>
          <path
            d="M384 422 Q450 510 516 422"
            fill="none"
            stroke="#2B5876"
            stroke-width="22"
            stroke-linecap="round"
          />

          <!-- ── Banner ────────────────────────────────────────────────────── -->
          <!-- Darker pink underlay gives the app's chunky-toy-button edge. -->
          <path
            d="M150 658 Q450 633 750 658 L700 715 L750 772 Q450 747 150 772 L200 715 Z"
            fill="#DDAEC6"
          />
          <path
            d="M150 650 Q450 625 750 650 L700 707 L750 764 Q450 739 150 764 L200 707 Z"
            fill="#F4DBE3"
            stroke="#DDAEC6"
            stroke-width="8"
            stroke-linejoin="round"
          />
          <text
            x="450"
            y="708"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="'Baloo 2'"
            font-weight="800"
            font-size="72"
            letter-spacing="-1"
            fill="#A05F83"
          >
            TwinkleTune
          </text>

          <!-- ── Edge URL ────────────────────────────────────────────────── -->
          <!-- Inside the scale(0.9669) group, so 29/7.2 here render at ~28/7
               canvas px — matching the other two stickers. -->
          <text
            text-anchor="middle"
            font-family="'Nunito'"
            font-weight="800"
            font-size="29"
            letter-spacing="7.2"
            fill="#000000"
          >
            <textPath href="#urlArc" startOffset="50%">TWINKLETUNE.APP</textPath>
          </text>
        </g>
  <g id="cutline" transform="translate(11.5 38.2) scale(0.9669)">
      <path
        class="cutline-path"
        d="M130 246 Q139 291 184 300 Q139 309 130 354 Q121 309 76 300 Q121 291 130 246 Z"
      />
      <path
        class="cutline-path"
        d="M785 222 Q792 261 831 268 Q792 275 785 314 Q778 275 739 268 Q778 261 785 222 Z"
      />
      <path
        class="cutline-path"
        d="M600 152 Q606 184 638 190 Q606 196 600 228 Q594 196 562 190 Q594 184 600 152 Z"
      />
      <path
        class="cutline-path"
        d="M450 103 L532.5 301 L747 317.5 L582 460.5 L637 675 L450 559.5 L263 675 L318 460.5 L153 317.5 L367.5 301 Z"
      />
      <path
        class="cutline-path"
        d="M150 650 Q450 625 750 650 L700 707 L750 764 Q450 739 150 764 L200 707 Z"
      />
    </g>
</svg>
