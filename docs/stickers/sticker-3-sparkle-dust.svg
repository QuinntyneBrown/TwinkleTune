<?xml version="1.0" encoding="UTF-8"?>
<!--
  TwinkleTune die-cut sticker — Mistakes are sparkle dust
  Generated by docs/stickers/render-stickers.mjs from src/sticker-3-sparkle-dust.html.
  Edit the HTML, not this file.

  The die cut is the outer edge of the white keyline, which is also the alpha
  edge of sticker-3-sparkle-dust.png. #cutline below traces the *artwork* outline in magenta —
  the prepress convention — and is hidden by default; the actual cut runs the
  width of the white keyline outside it: 65px, 0.217in at 300 DPI.
  Text is live — outline it before sending this SVG to a printer that is not
  rasterising the PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="3in" height="3in" style="--cut-extra: 139px">
  <title>Mistakes are sparkle dust</title>
  <defs>
    <style>
      @font-face {
        font-family: "Baloo 2";
        src: url("src/fonts/Baloo2-Variable.ttf") format("truetype");
        font-weight: 400 800;
        font-display: block;
      }
      @font-face {
        font-family: "Nunito";
        src: url("src/fonts/Nunito-Variable.ttf") format("truetype");
        font-weight: 200 1000;
        font-display: block;
      }

      /* --- Shared artwork idioms -------------------------------------------- */
      
      /* Every silhouette piece is painted white with a fat round-joined stroke
         and paint-order:stroke, so the stroke sits entirely outside the shape.
         Overlapping white pieces union into one continuous die-cut outline. */
      .keyline {
        fill: #ffffff;
        stroke: #ffffff;
        stroke-linejoin: round;
        stroke-linecap: round;
        paint-order: stroke;
      }
      
      /* Width = the shape's own art stroke + --cut-extra, half of which shows as
         white beyond the artwork edge. The rim is wide enough to carry the
         TWINKLETUNE.APP edge type.
      
         --cut-extra is in ART-SPACE units, and each sticker scales its art group by
         a different factor, so every sticker overrides it with 130px / its own scale.
         That lands the visible rim at a uniform 65 canvas px (0.217in at 300 DPI)
         across all three. Setting one shared value here instead would make the rim
         visibly thicker on the more-scaled-up stickers. */
      :root { --cut-extra: 130px; }
      .cut-star { stroke-width: calc(38.5px + var(--cut-extra)); } /* big star   */
      .cut-icon { stroke-width: calc(15.6px + var(--cut-extra)); } /* icon star  */
      .cut-mini { stroke-width: calc(13px + var(--cut-extra)); }   /* small star */
      .cut-band { stroke-width: calc(8px + var(--cut-extra)); }    /* banner     */
      .cut-line { stroke-width: calc(10px + var(--cut-extra)); }   /* bubble     */
      .cut-cloud { stroke-width: calc(10px + var(--cut-extra)); }  /* cloud      */
      .cut-flat { stroke-width: var(--cut-extra); }                /* sparkles   */
      
      .tt-star-face circle { stroke: none; }
      
      text {
        paint-order: stroke;
        stroke-linejoin: round;
      }

      #cutline { display: none; }
      .cutline-path {
        fill: none;
        stroke: #ff00ff;
        stroke-width: 2;
        stroke-linejoin: round;
      }
    </style>
  </defs>

        <title>Speech bubble reading "mistakes are sparkle dust"</title>

        <!-- This sticker's art was drawn at 1:1 on the 900px canvas. The wider
             rim needs room, so everything is wrapped in one group and scaled
             down; every coordinate below is still the original art space. -->
        <g transform="translate(30.7 30.5) scale(0.9327)">

          <defs>
            <!-- Arc for the edge URL, on the white rim ABOVE the bubble. The
                 bottom edge can't carry it: the tail (x ~300, down to y 760)
                 and Twinkle (x 590-790) leave only ~250px of clean run. The top
                 edge is straight and clear from x 160 to x 740. -->
            <path id="urlArc" fill="none" d="M 215 101 Q 450 89 685 101" />
          </defs>

          <!-- ── Die-cut silhouette ────────────────────────────────────────── -->
          <g>
            <path
              class="keyline cut-flat"
              d="M104 106 Q111 145 150 152 Q111 159 104 198 Q97 159 58 152 Q97 145 104 106 Z"
            />
            <path
              class="keyline cut-flat"
              d="M798 108 Q805 143 840 150 Q805 157 798 192 Q791 157 756 150 Q791 143 798 108 Z"
            />
            <path
              class="keyline cut-flat"
              d="M100 580 Q106 612 138 618 Q106 624 100 656 Q94 624 62 618 Q94 612 100 580 Z"
            />
            <path
              class="keyline cut-line"
              d="M160 130 L740 130 Q830 130 830 220 L830 550 Q830 640 740 640 L452 640 L300 760 L340 640 L160 640 Q70 640 70 550 L70 220 Q70 130 160 130 Z"
            />
            <path
              class="keyline cut-mini"
              d="M690 593.8 L717.8 660.4 L789.9 666 L734.4 714.1 L752.9 786.2 L690 747.4 L627.1 786.2 L645.6 714.1 L590.1 666 L662.3 660.4 Z"
            />
          </g>

          <!-- ── Bubble ────────────────────────────────────────────────────── -->
          <path
            d="M160 130 L740 130 Q830 130 830 220 L830 550 Q830 640 740 640 L452 640 L300 760 L340 640 L160 640 Q70 640 70 550 L70 220 Q70 130 160 130 Z"
            fill="#F4DBE3"
            stroke="#DDAEC6"
            stroke-width="10"
            stroke-linejoin="round"
          />

          <!-- Edge sparkles sit on top of the bubble, straddling its outline, so
               the die cut picks up their points and each one reads whole. -->
          <path
            d="M104 106 Q111 145 150 152 Q111 159 104 198 Q97 159 58 152 Q97 145 104 106 Z"
            fill="#FFD66B"
          />
          <path
            d="M798 108 Q805 143 840 150 Q805 157 798 192 Q791 157 756 150 Q791 143 798 108 Z"
            fill="#5EA8DA"
          />
          <path
            d="M100 580 Q106 612 138 618 Q106 624 100 656 Q94 624 62 618 Q94 612 100 580 Z"
            fill="#DDAEC6"
          />

          <!-- ── Copy ──────────────────────────────────────────────────────── -->
          <text
            x="450"
            y="248"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="'Nunito'"
            font-weight="800"
            font-size="46"
            letter-spacing="8"
            fill="#A05F83"
          >
            MISTAKES ARE
          </text>
          <text
            x="450"
            y="390"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="'Baloo 2'"
            font-weight="800"
            font-size="128"
            letter-spacing="-2"
            fill="#2B5876"
          >
            SPARKLE
          </text>
          <text
            x="450"
            y="528"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="'Baloo 2'"
            font-weight="800"
            font-size="128"
            letter-spacing="-2"
            fill="#2B5876"
          >
            DUST
          </text>

          <!-- Sparkles flanking DUST -->
          <path d="M212 492 Q218 522 248 528 Q218 534 212 564 Q206 534 176 528 Q206 522 212 492 Z" fill="#FFD66B" />
          <path d="M688 492 Q694 522 724 528 Q694 534 688 564 Q682 534 652 528 Q682 522 688 492 Z" fill="#FFD66B" />

          <!-- ── Twinkle, peeking over the bubble's bottom-right corner ────── -->
          <path
            d="M690 593.8 L717.8 660.4 L789.9 666 L734.4 714.1 L752.9 786.2 L690 747.4 L627.1 786.2 L645.6 714.1 L590.1 666 L662.3 660.4 Z"
            fill="#FFD66B"
            stroke="#E8B445"
            stroke-width="12.95"
            stroke-linejoin="round"
          />
          <g class="tt-star-face">
            <circle cx="654.9" cy="704.8" r="10.2" fill="#F4DBE3" />
            <circle cx="725.2" cy="704.8" r="10.2" fill="#F4DBE3" />
            <circle cx="667.8" cy="686.3" r="8.3" fill="#2B5876" />
            <circle cx="712.2" cy="686.3" r="8.3" fill="#2B5876" />
            <circle cx="665.1" cy="683.6" r="2.7" fill="#FFFFFF" />
            <circle cx="709.5" cy="683.6" r="2.7" fill="#FFFFFF" />
          </g>
          <path
            d="M667.8 701.1 Q690 730.7 712.2 701.1"
            fill="none"
            stroke="#2B5876"
            stroke-width="7.4"
            stroke-linecap="round"
          />

          <!-- ── Edge URL ──────────────────────────────────────────────────── -->
          <!-- Inside the scale(0.9351) group, so 30/7.5 here render at ~28/7
               canvas px — matching the other two stickers. -->
          <text
            text-anchor="middle"
            font-family="'Nunito'"
            font-weight="800"
            font-size="30"
            letter-spacing="7.5"
            fill="#000000"
          >
            <textPath href="#urlArc" startOffset="50%">TWINKLETUNE.APP</textPath>
          </text>
        </g>
  <g id="cutline" transform="translate(30.7 30.5) scale(0.9327)">
      <path
        class="cutline-path"
        d="M104 106 Q111 145 150 152 Q111 159 104 198 Q97 159 58 152 Q97 145 104 106 Z"
      />
      <path
