<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TwinkleTune sticker — app icon</title>
    <link rel="stylesheet" href="stickers.css" />
  </head>
  <body>
    <div class="stage">
      <!--
        Sticker 5 — the app-icon lockup from the "TwinkleTune Logo" frame in
        Magic Patterns: the mark without its note on a Tune Blue tile with 22%
        corners and a chunky blue-edge underside. The mark keeps Mark.tsx's
        120-unit coordinates, placed with translate(240 190) scale(3.5) so it
        fills three quarters of the tile, as it does in the frame. The note
        that the small icon drops comes back here, hopping out of the corner.
      -->
      <!-- The fit group below only translates, so --cut-extra stays at 130px
           for the same 65px rim as the rest of the set. See stickers.css. -->
      <svg
        class="sticker"
        viewBox="0 0 900 900"
        xmlns="http://www.w3.org/2000/svg"
        style="--cut-extra: 130px"
      >
        <title>TwinkleTune app icon: Twinkle the star singing on a blue tile</title>

        <!-- Centre the cut on the canvas: the art runs from y 45 (top of the
             note) to y 705 (underside of the tile), and from x 140 (the lower
             sparkle) to x 772 (the note's flag). -->
        <g transform="translate(-6 75)">

          <defs>
            <!-- The tile's underside is flat between its corners (x 293-607),
                 and the corners have only risen ~3px by the ends of the type,
                 so the URL runs straight down the middle of the rim. -->
            <path id="urlArc" fill="none" d="M 210 747.5 L 690 747.5" />
          </defs>

          <!-- ── Die-cut silhouette ────────────────────────────────────────── -->
          <g>
            <path
              class="keyline cut-flat"
              d="M200 106 Q207 143 244 150 Q207 157 200 194 Q193 157 156 150 Q193 143 200 106 Z"
            />
            <path
              class="keyline cut-flat"
              d="M730 266 Q736 294 764 300 Q736 306 730 334 Q724 306 696 300 Q724 294 730 266 Z"
            />
            <path
              class="keyline cut-flat"
              d="M170 530 Q175 555 200 560 Q175 565 170 590 Q165 565 140 560 Q165 555 170 530 Z"
            />
            <rect class="keyline cut-flat" x="170" y="120" width="560" height="585" rx="123" />
            <ellipse
              class="keyline cut-scaled"
              style="--k: 5"
              transform="translate(110 15) scale(5) rotate(-22 113 33)"
              cx="113"
              cy="33"
              rx="7.2"
              ry="5.4"
            />
            <path
              class="keyline cut-scaled"
              style="--k: 5"
              transform="translate(110 15) scale(5)"
              d="M117.6 33 L117.6 6 C126 9 134 13 132 25 C130 19 125 16.5 121.4 16 L121.4 33 Z"
            />
          </g>

          <!-- ── The tile ──────────────────────────────────────────────────── -->
          <!-- Darker underlay 25px below the face: the frame's 8px shadow at
               this size, and the app's chunky-toy-button edge. -->
          <rect x="170" y="145" width="560" height="560" rx="123" fill="#3F88BC" />
          <rect x="170" y="120" width="560" height="560" rx="123" fill="#5EA8DA" />

          <!-- Edge sparkles straddle the tile's outline so the die cut picks up
               their points. -->
          <path
            d="M200 106 Q207 143 244 150 Q207 157 200 194 Q193 157 156 150 Q193 143 200 106 Z"
            fill="#FFD66B"
          />
          <path
            d="M730 266 Q736 294 764 300 Q736 306 730 334 Q724 306 696 300 Q724 294 730 266 Z"
            fill="#DDAEC6"
          />
          <path
            d="M170 530 Q175 555 200 560 Q175 565 170 590 Q165 565 140 560 Q165 555 170 530 Z"
            fill="#FFD66B"
          />

          <!-- ── The mark (Mark.tsx without its note, verbatim) ────────────── -->
          <g transform="translate(240 190) scale(3.5)">
            <path
              d="M60 10 L75.87 40.16 L109.46 45.93 L85.68 70.34 L90.57 104.07 L60 89 L29.43 104.07 L34.32 70.34 L10.54 45.93 L44.13 40.16 Z"
              fill="#FFD66B"
              stroke="#E8B445"
              stroke-width="7"
              stroke-linejoin="round"
            />
            <path d="M55 30 Q58 22 60 19" fill="none" stroke="#FFF1C2" stroke-width="4" stroke-linecap="round" />
            <circle cx="50" cy="60" r="4.4" fill="#2B5876" />
            <circle cx="70" cy="60" r="4.4" fill="#2B5876" />
            <circle cx="42.5" cy="70" r="5.4" fill="#F4DBE3" />
            <circle cx="77.5" cy="70" r="5.4" fill="#F4DBE3" />
            <ellipse cx="60" cy="73.5" rx="6" ry="7" fill="#2B5876" />
            <ellipse cx="60" cy="77.5" rx="3.6" ry="2.4" fill="#F4A6BD" />
          </g>

          <!-- ── The note, hopping out of the top-right corner ─────────────── -->
          <!-- Mark.tsx's note geometry in Ink, which reads on both the blue
               tile and the white rim. -->
          <g transform="translate(110 15) scale(5)" fill="#2B5876">
            <ellipse cx="113" cy="33" rx="7.2" ry="5.4" transform="rotate(-22 113 33)" />
            <rect x="117.6" y="6" width="3.8" height="27" rx="1.9" />
            <path d="M119.5 6 C126 9 134 13 132 25 C130 19 125 16.5 119.5 16 Z" />
          </g>

          <!-- ── Edge URL ────────────────────────────────────────────────── -->
          <text
            text-anchor="middle"
            font-family="'Nunito'"
            font-weight="800"
            font-size="28"
            letter-spacing="7"
            fill="#000000"
          >
            <textPath href="#urlArc" startOffset="50%">TWINKLETUNE.APP</textPath>
          </text>
        </g>
      </svg>
    </div>
  </body>
</html>
