<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TwinkleTune sticker — wordmark cloud</title>
    <link rel="stylesheet" href="stickers.css" />
  </head>
  <body>
    <div class="stage">
      <!--
        Sticker 2 — the wordmark on a cloud, with the app-icon star breaking
        the top of the outline. Star geometry is frontend/public/icon.svg
        mapped with x' = 2.6x + 294, y' = 2.6y + 171. Wordmark follows
        .logo / .logo .tw from frontend/src/styles/screens.css: "Twinkle" in
        --blue, "Tune" in --ink.
      -->
      <svg class="sticker" viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg">
        <title>TwinkleTune wordmark on a cloud</title>

        <!-- Fit to the 3in canvas: measured art box 751x616 at 1:1; 1.13 lifts the long edge to ~850px (2.83in).
             A uniform scale keeps every stroke width proportional. -->
        <g transform="translate(-50.6 -88.4) scale(1.13)">


          <defs>
            <linearGradient id="cloudFill" gradientUnits="userSpaceOnUse" x1="0" y1="310" x2="0" y2="712">
              <stop offset="0" stop-color="#FFFFFF" />
              <stop offset="0.45" stop-color="#F3FAFE" />
              <stop offset="0.8" stop-color="#DCEFFA" />
              <stop offset="1" stop-color="#C9E6F8" />
            </linearGradient>
          </defs>

          <!-- ── Die-cut silhouette ────────────────────────────────────────── -->
          <g>
            <path
              class="keyline cut-flat"
              d="M140 428 Q147 463 182 470 Q147 477 140 512 Q133 477 98 470 Q133 463 140 428 Z"
            />
            <path
              class="keyline cut-flat"
              d="M735 363 Q742 398 777 405 Q742 412 735 447 Q728 412 693 405 Q728 398 735 363 Z"
            />
            <path
              class="keyline cut-flat"
              d="M330 675 Q336 709 370 715 Q336 721 330 755 Q324 721 290 715 Q324 709 330 675 Z"
            />
            <path
              class="keyline cut-cloud"
              d="M165 690 C115 682 110 600 155 570 C133 500 190 442 258 462 C270 365 380 325 445 380 C500 325 600 345 613 420 C690 395 768 452 748 535 C798 563 795 655 738 690 C655 710 570 682 490 694 C400 706 275 710 165 690 Z"
            />
            <path
              class="keyline cut-icon"
              d="M450 207.4 L482.5 285.4 L567 291.9 L502 347.8 L523.6 432.3 L450 386.8 L376.4 432.3 L398 347.8 L333 291.9 L417.5 285.4 Z"
            />
          </g>

          <!-- ── Cloud ─────────────────────────────────────────────────────── -->
          <path
            d="M165 690 C115 682 110 600 155 570 C133 500 190 442 258 462 C270 365 380 325 445 380 C500 325 600 345 613 420 C690 395 768 452 748 535 C798 563 795 655 738 690 C655 710 570 682 490 694 C400 706 275 710 165 690 Z"
            fill="url(#cloudFill)"
            stroke="#83C5F1"
            stroke-width="10"
            stroke-linejoin="round"
          />

          <!-- Edge sparkles sit on top of the cloud, straddling its outline, so
               the die cut picks up their points and each one reads whole. -->
          <path
            d="M140 428 Q147 463 182 470 Q147 477 140 512 Q133 477 98 470 Q133 463 140 428 Z"
            fill="#FFD66B"
          />
          <path
            d="M735 363 Q742 398 777 405 Q742 412 735 447 Q728 412 693 405 Q728 398 735 363 Z"
            fill="#5EA8DA"
          />
          <path
            d="M330 675 Q336 709 370 715 Q336 721 330 755 Q324 721 290 715 Q324 709 330 675 Z"
            fill="#DDAEC6"
          />

          <!-- ── Wordmark ──────────────────────────────────────────────────── -->
          <text
            x="450"
            y="520"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="'Baloo 2'"
            font-weight="800"
            font-size="84"
            letter-spacing="-1"
          >
            <tspan fill="#5EA8DA">Twinkle</tspan><tspan fill="#2B5876">Tune</tspan>
          </text>

          <!-- Tagline in the app's pink chip -->
          <rect x="185" y="565" width="530" height="76" rx="38" fill="#F4DBE3" />
          <text
            x="450"
            y="604"
            text-anchor="middle"
            dominant-baseline="central"
            font-family="'Nunito'"
            font-weight="800"
            font-size="34"
            letter-spacing="0.4"
            fill="#A05F83"
          >
            Sing your heart out!
          </text>

          <!-- ── The app-icon star, breaking the top of the cloud ──────────── -->
          <path
            d="M450 207.4 L482.5 285.4 L567 291.9 L502 347.8 L523.6 432.3 L450 386.8 L376.4 432.3 L398 347.8 L333 291.9 L417.5 285.4 Z"
            fill="#FFD66B"
            stroke="#E8B445"
            stroke-width="15.6"
            stroke-linejoin="round"
          />
          <g class="tt-star-face">
            <circle cx="408.4" cy="337.4" r="12" fill="#F4DBE3" />
            <circle cx="491.6" cy="337.4" r="12" fill="#F4DBE3" />
            <circle cx="424" cy="316.6" r="9.9" fill="#2B5876" />
            <circle cx="476" cy="316.6" r="9.9" fill="#2B5876" />
            <circle cx="420.8" cy="313.4" r="3.2" fill="#FFFFFF" />
            <circle cx="472.8" cy="313.4" r="3.2" fill="#FFFFFF" />
          </g>
          <path
            d="M424 337.4 Q450 372 476 337.4"
            fill="none"
            stroke="#2B5876"
            stroke-width="8.8"
            stroke-linecap="round"
          />
        </g>
      </svg>
  </div>
</body>
</html>
