<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tuner (dev) · listening — TwinkleTune mocks</title>
<meta name="mock:kind" content="page">
<meta name="mock:screen" content="tuner">
<meta name="mock:state" content="listening">
<meta name="mock:requirements" content="AE-L2-17">
<meta name="description" content="Listening: the detected note, how far off it is, and the raw pitch, clarity and level.">
<link rel="stylesheet" href="../../assets/tokens.css">
<link rel="stylesheet" href="../../assets/ui.css">
<link rel="stylesheet" href="../../assets/mock.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="sky sky--day" aria-hidden="true">
  <div class="cloud"></div>
  <div class="cloud"></div>
  <div class="cloud"></div>
  <span class="tstar">✦</span>
  <span class="tstar">✦</span>
  <span class="tstar">✦</span>
  <span class="tstar">✦</span>
  <span class="fnote">🎵</span>
  <span class="fnote">🎶</span>
</div>
<main id="main" class="screen screen--nonav">
    <header class="topbar rise">
      <a class="icon-btn" href="../../pages/home/default.html" aria-label="Go back">←</a>
      <h1 class="title">Tuner (dev)</h1>
      <span class="spacer"></span>
    </header>
    <section class="card">
      <div class="tuner-note" data-note>A4</div>
      <div class="tuner-cents">
        <div class="center"></div>
        <div class="needle" data-needle style="left:calc(50% + 8% - .25rem)"></div>
      </div>
      <div class="tuner-meta">
        <span data-hz>442.0 Hz</span>
        <span data-clarity>clarity 97%</span>
        <span data-rms>rms 0.082</span>
      </div>
    </section>
    <div class="ctas ctas--tight">
      <button class="btn btn-xl" data-toggle>Stop</button>
    </div>
</main>

<aside class="mock-notes" aria-label="Design notes">
  <p class="mock-note">The needle moves ±50 cents either side of the centre line.</p>
</aside>

</nav>

</body>
</html>
