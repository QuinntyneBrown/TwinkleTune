<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TwinkleTune — Twinkle's Tips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/twinkle.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="cloud" style="width:150px;height:46px;top:9%;animation-duration:100s"></div>
  <div class="cloud" style="width:100px;height:32px;top:58%;animation-duration:85s;animation-delay:-40s;opacity:.5"></div>
  <span class="tstar" style="top:18%;left:6%">✦</span>
  <span class="tstar" style="top:30%;right:8%;animation-delay:1s">✦</span>
  <span class="fnote" style="top:72%;right:5%;animation-delay:.6s">🎶</span>
</div>

<main class="screen">

  <header class="topbar rise">
    <a class="icon-btn" href="03-home.html" aria-label="Go back">←</a>
    <h1 class="title">Twinkle's Tips 💡</h1>
    <span class="spacer"></span>
  </header>

  <div class="coach rise d1">
    <svg class="mascot mascot-sm" viewBox="0 0 120 120" aria-hidden="true">
      <path d="M60 6 L75 42 L114 45 L84 71 L94 110 L60 89 L26 110 L36 71 L6 45 L45 42 Z"
            fill="#FFD66B" stroke="#E8B445" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="48" cy="56" r="4.5" fill="#2B5876"/>
      <circle cx="72" cy="56" r="4.5" fill="#2B5876"/>
      <circle cx="41" cy="66" r="5.5" fill="#F4DBE3"/>
      <circle cx="79" cy="66" r="5.5" fill="#F4DBE3"/>
      <path d="M50 66 Q60 76 70 66" fill="none" stroke="#2B5876" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="bubble bubble-left">Every great singer started <strong>exactly</strong> where you are! 💙</div>
  </div>

  <section class="tip-hero rise d2" aria-label="Twinkle's favourite tip">
    <span class="label">⭐ TWINKLE'S FAVOURITE</span>
    <h2>Breathe like a balloon</h2>
    <p>Fill your tummy up sloooowly, then sing as it floats out.</p>
    <button class="btn btn-sm">Try it with me ▶</button>
    <span class="balloon" aria-hidden="true">🎈</span>
  </section>

  <div class="chip-row rise d3" role="tablist" aria-label="Tip categories">
    <button class="chip active" role="tab" aria-selected="true">All</button>
    <button class="chip" role="tab">🌬️ Breathing</button>
    <button class="chip" role="tab">💪 Brave Voice</button>
    <button class="chip" role="tab">🎶 Warm-ups</button>
    <button class="chip" role="tab">🎭 Show Time</button>
  </div>

  <!-- tapping any card opens the step-by-step modal (see 09) and awards +5 sparkles -->
  <div class="tip-list">

    <button class="tip-card rise d4">
      <span class="tip-ico ti-1" aria-hidden="true">🚒</span>
      <span class="tip-body">
        <strong>Siren like a firetruck</strong>
        <span>Slide your voice low to high — wheee-ooo!</span>
      </span>
      <span class="tip-min">1 min</span>
    </button>

    <button class="tip-card rise d5">
      <span class="tip-ico ti-2" aria-hidden="true">🌟</span>
      <span class="tip-body">
        <strong>Stand like a star</strong>
        <span>Feet apart, chin up, arms wide — feel mighty!</span>
      </span>
      <span class="tip-min">1 min</span>
    </button>

    <button class="tip-card rise d6">
      <span class="tip-ico ti-3" aria-hidden="true">🐝</span>
      <span class="tip-body">
        <strong>The bumblebee hum</strong>
        <span>Hummmm gently to wake your voice up.</span>
      </span>
      <span class="tip-min">2 min</span>
    </button>

    <button class="tip-card rise d7">
      <span class="tip-ico ti-4" aria-hidden="true">✨</span>
      <span class="tip-body">
        <strong>Mistakes are sparkle dust</strong>
        <span>Wobbly notes mean you're learning — keep going!</span>
      </span>
      <span class="tip-min">read</span>
    </button>

    <button class="tip-card rise d7">
      <span class="tip-ico ti-2" aria-hidden="true">🦁</span>
      <span class="tip-body">
        <strong>Tiny mouse, big lion</strong>
        <span>Sing a line tiny, then BIG — feel the difference.</span>
      </span>
      <span class="tip-min">2 min</span>
    </button>

    <button class="tip-card rise d8">
      <span class="tip-ico ti-3" aria-hidden="true">🧸</span>
      <span class="tip-body">
        <strong>Sing to your teddy first</strong>
        <span>Practice for a friendly audience of toys.</span>
      </span>
      <span class="tip-min">3 min</span>
    </button>

  </div>

  <section class="quote rise d8" aria-label="Confidence corner">
    <span class="hearts" aria-hidden="true">💖</span>
    <p>“Your voice is one of a kind — that's your superpower.”</p>
    <small>— Twinkle</small>
  </section>

</main>

  <a class="bn-item" href="03-home.html"><span class="ico">🏠</span>Home</a>

</nav>

  <a href="08-progress.html" title="Next screen">▶</a>
</nav>

</body>
</html>
