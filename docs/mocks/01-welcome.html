<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TwinkleTune — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/twinkle.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>

<div class="sky" aria-hidden="true">
  <div class="cloud" style="width:150px;height:46px;top:9%;animation-duration:95s"></div>
  <div class="cloud" style="width:100px;height:32px;top:24%;animation-duration:75s;animation-delay:-30s;opacity:.6"></div>
  <div class="cloud" style="width:180px;height:54px;top:70%;animation-duration:110s;animation-delay:-60s;opacity:.5"></div>
  <span class="tstar" style="top:14%;left:12%">✦</span>
  <span class="tstar" style="top:10%;right:16%;animation-delay:.9s">✦</span>
  <span class="tstar" style="top:48%;left:6%;animation-delay:1.4s">✦</span>
  <span class="tstar" style="top:58%;right:8%;animation-delay:.4s">✦</span>
  <span class="fnote" style="top:30%;left:8%;animation-delay:.7s">🎵</span>
  <span class="fnote" style="top:38%;right:7%;animation-delay:1.8s">🎶</span>
</div>

<main class="screen screen--center screen--nonav">

  <svg class="mascot mascot-lg pop" viewBox="0 0 120 120" aria-hidden="true">
    <path d="M60 6 L75 42 L114 45 L84 71 L94 110 L60 89 L26 110 L36 71 L6 45 L45 42 Z"
          fill="#FFD66B" stroke="#E8B445" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="48" cy="56" r="4.5" fill="#2B5876"/>
    <circle cx="72" cy="56" r="4.5" fill="#2B5876"/>
    <circle cx="41" cy="66" r="5.5" fill="#F4DBE3"/>
    <circle cx="79" cy="66" r="5.5" fill="#F4DBE3"/>
    <path d="M50 66 Q60 76 70 66" fill="none" stroke="#2B5876" stroke-width="4" stroke-linecap="round"/>
  </svg>

  <h1 class="logo rise d1"><span class="tw">Twinkle</span>Tune</h1>
  <p class="tagline rise d2">Sing your heart out! 🎤</p>

  <div class="hello-bubble rise d3">
    <div class="bubble bubble-left">Hi! I'm <strong>Twinkle</strong>, your singing buddy. What should I call you?</div>
  </div>

  <div class="card name-card rise d4">
    <label for="kid-name">My name is…</label>
    <input class="name-input" id="kid-name" type="text" value="Mia" maxlength="20" placeholder="Type your name">
  </div>

  <p class="pick-label rise d5">Pick your singer! 🌟</p>
  <div class="avatars rise d5">
    <div>
      <button class="avatar-pick picked" aria-pressed="true">🦄</button>
      <span class="picked-tag">PICKED!</span>
    </div>
    <button class="avatar-pick" aria-pressed="false">🐱</button>
    <button class="avatar-pick" aria-pressed="false">🐸</button>
    <button class="avatar-pick" aria-pressed="false">🦊</button>
  </div>

  <div class="welcome-cta rise d6">
    <a class="btn btn-xl" href="02-voice-setup.html">Let's Sing! 🎤</a>
  </div>

  <p class="grownups rise d7">
    <a class="link-quiet" href="10-profiles.html">👨‍👧‍👧 Family profiles</a>
    <a class="link-quiet" href="09-dialogs.html">🔒 Grown-Ups Corner</a>
  </p>

</main>

<nav class="mock-nav" aria-label="Mockup navigation">
  <span>MOCKUP</span>
  <a href="index.html" title="All screens">⊞</a>
  <a href="index.html" title="Previous screen">◀</a>
  <a href="02-voice-setup.html" title="Next screen">▶</a>
</nav>

</body>
</html>
